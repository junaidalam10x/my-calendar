<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Calendar</title>
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="My Calendar">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <button id="prev" aria-label="Previous month">‹</button>
    <h1 id="title"></h1>
    <button id="next" aria-label="Next month">›</button>
    <button id="today" class="pill">Today</button>
  </header>

  <div id="chips" class="chips" aria-label="Show holidays by religion"></div>

  <main>
    <div class="weekdays">
      <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
    </div>
    <div id="grid" class="grid"></div>

    <section class="agenda">
      <h2 id="agendaTitle"></h2>
      <ul id="agendaList"></ul>
    </section>

    <footer>
      <button id="export" class="link">Export backup</button>
      <button id="import" class="link">Import backup</button>
      <input id="file" type="file" accept="application/json" hidden>
    </footer>
    <p class="note">Holidays: 2026–2027 festivals + fixed &amp; Easter dates for any year. Islamic dates may shift ±1 day with moon sighting.</p>
  </main>

  <button id="add" class="fab" aria-label="Add event">+</button>

  <dialog id="dlg">
    <form id="form" method="dialog">
      <h3 id="dlgTitle">New event</h3>
      <label>Title <input id="fTitle" required maxlength="80" autocomplete="off"></label>
      <div class="row">
        <label>Date <input id="fDate" type="date" required></label>
        <label>Time <input id="fTime" type="time"></label>
      </div>
      <label>Notes <textarea id="fNotes" rows="3" maxlength="500"></textarea></label>
      <div class="colors" id="colors"></div>
      <div class="actions">
        <button type="button" id="delete" class="danger" hidden>Delete</button>
        <span class="spacer"></span>
        <button type="button" id="cancel">Cancel</button>
        <button type="submit" class="primary">Save</button>
      </div>
    </form>
  </dialog>

  <script src="holidays.js"></script>
  <script src="app.js"></script>
</body>
</html>
